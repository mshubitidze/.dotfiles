onboarding = false

[experimental]
pane_history = true

switch_ascii_input_source_in_prefix = true
[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[keys]
prefix = "ctrl+a"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "/Users/misho/.config/herdr/herdr-nav.sh left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "/Users/misho/.config/herdr/herdr-nav.sh down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "/Users/misho/.config/herdr/herdr-nav.sh up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "/Users/misho/.config/herdr/herdr-nav.sh right"

# via fish so the themed `lazygit` function runs (a bare command bypasses it).
[[keys.command]]
key = "ctrl+shift+g"
type = "pane"
command = "fish -c lazygit"

[[keys.command]]
key = "ctrl+shift+n"
type = "pane"
command = "nvim"

[theme]
# Resolve semantic UI colors through Ghostty's active 16-color palette.
name = "terminal"

auto_switch = false
[theme.custom]
# Herdr's terminal theme uses ANSI bright-black for selected-item contrast,
# which is too dark in light palettes. ANSI black tracks each theme's first
# surface layer instead (#262626 in Oxocarbon Dark / #f3f3f3 in Light).
surface0 = "black"
surface_dim = "black"
